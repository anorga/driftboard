<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Driftboard — a real-time collaborative whiteboard. Sketch, plan, and think together with live cursors and conflict-free sync."
    />
    <title>Driftboard — realtime collaborative whiteboard</title>
    <script>
      // Set theme before paint to avoid a flash of the wrong theme
      try {
        const t = localStorage.getItem("driftboard:theme");
        const dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
